<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>select-assist</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // set mode before first paint to avoid flash
    document.documentElement.dataset.mode = location.hash === '#panel' ? 'panel' : 'chip';
  </script>
</head>
<body>
  <!-- ======== chip window = collapsed title bar (focusable:false, non-activating) ======== -->
  <div id="chip">
    <span id="dot" class="icon-btn" tabindex="0" role="button" aria-label="展开面板">▸</span>
    <span id="chip-status" class="status">还没有选区</span>
    <span id="chip-badge" aria-label="剪贴板有新复制"></span>
    <button id="chip-capture" class="primary" data-tip="把刚才复制的内容取进来">取入选区</button>
  </div>

  <!-- ======== panel window (focusable, shown/hidden) ======== -->
  <div id="panel">
    <div id="panel-head">
      <span id="collapse" class="icon-btn" tabindex="0" role="button" aria-label="折叠">▾</span>
      <span id="head-status" class="status">还没有选区</span>
      <button id="head-capture" class="primary" data-tip="把刚才复制的内容取进来">取入选区</button>
      <span id="quit" class="icon-btn" data-tip="退出常驻" tabindex="0" role="button" aria-label="退出常驻">✕</span>
    </div>

    <section id="ctx-group">
      <div id="ctx-row">
        <div id="mode-seg" role="tablist" aria-label="工作模式">
          <button type="button" role="tab" id="mode-read" aria-selected="true" data-tip="带会话历史组装 Prompt">会话解读</button>
          <button type="button" role="tab" id="mode-direct" aria-selected="false" data-tip="逐字节原文，翻译 / 检索即用">选区直通</button>
        </div>
        <span id="ctx-selects">
          <select id="ctx-agent">
            <option value="auto">自动判定</option>
            <option value="claude-code">Claude Code</option>
            <option value="codex">Codex</option>
            <option value="workbuddy">WorkBuddy</option>
            <option value="qoder">Qoder</option>
          </select>
          <select id="ctx-turns" data-tip="按轮数截取，不做字符截断">
            <option value="4">4 轮</option><option value="8" selected>8 轮</option><option value="16">16 轮</option><option value="30">30 轮</option><option value="all">全部</option>
          </select>
        </span>
      </div>
      <div id="ctx-actions" class="hidden">
        <button id="ctx-browse" data-tip="点一条即用它填充">浏览会话</button>
        <button id="ctx-refresh">刷新上下文</button>
      </div>
      <div id="sum-session" class="line-slot"></div>
      <div id="ctx-status" class="line-slot"></div>
      <section id="browser" class="hidden">
        <div id="browser-list"></div>
      </section>
    </section>

    <section id="act-group">
      <div id="actions">
        <select id="prompt-pick" data-tip="增删改在设置里"></select>
        <button id="copy" class="primary" data-tip="指令 + 选区 + 历史，一次复制">复制 Prompt</button>
        <span id="sites"></span>
      </div>
      <div id="pack-meta" class="line-slot"></div>
    </section>

    <details id="settings">
      <summary>设置</summary>
      <div class="ctx-only">
        <label>提问指令</label>
        <div id="pe-bar">
          <select id="pe-pick"></select>
          <button id="pe-new" type="button">+ 新建</button>
          <button id="pe-del" type="button">删除</button>
          <span id="pe-count"></span>
        </div>
        <textarea id="pe-tpl" rows="3"></textarea>
        <label>会话路径<textarea id="set-sessions" rows="5" data-tip="每行：agent|路径；发现只读这里，删一行即停扫该源"></textarea></label>
        <label class="switch"><input id="set-redact" type="checkbox" data-tip="组装时家目录写作 ~" /> 路径脱敏</label>
      </div>
      <label class="site-edit" data-for="read">目标站<textarea id="set-chat-sites" rows="3" data-tip="每行：名称|URL"></textarea></label>
      <label class="site-edit" data-for="direct">目标站<textarea id="set-direct-sites" rows="3" data-tip="每行：名称|URL"></textarea></label>
      <button id="set-save">保存设置</button>
    </details>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
