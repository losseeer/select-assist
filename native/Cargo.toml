[package]
name = "select-assist-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSPanel",
    "NSPasteboard",
    "NSPopUpButton",
    "NSScreen",
    "NSSegmentedControl",
    "NSSwitch",
    "NSText",
    "NSTextField",
    "NSTextFieldCell",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
