[package]
name = "app-win"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "select-assist-native"
path = "src/main.rs"

[dependencies]
ctxpack = { path = "../ctxpack" }
settings = { path = "../settings" }

# 只在 Windows 上取真正用到的 API；mac/Linux 上这个 crate 编成一个空 main，
# 这样 `cargo test` 在 Mac 上照样全绿，不会多一个编不过的目标
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
# 版本必须跟 webview2-com 用的那套 windows-core 对齐，否则 HWND 跨不过去
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
] }
