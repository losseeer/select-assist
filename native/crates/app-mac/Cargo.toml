[package]
name = "select-assist-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ctxpack = { path = "../ctxpack" }
capture = { path = "../capture" }
settings = { path = "../settings" }
serde = { version = "1", features = ["derive"] }
# 写回共用文件时保持用户的键序
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "std",
    "block2",
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSEvent",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSLayoutManager",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSPanel",
    "NSPasteboard",
    "NSPopUpButton",
    "NSPopUpButtonCell",
    "NSMenu",
    "NSMenuItem",
    "NSScreen",
    "NSSegmentedControl",
    "NSSegmentedCell",
    "NSScrollView",
    "NSSwitch",
    "NSText",
    "NSTextContainer",
    "NSTextView",
    "NSTextStorage",
    "NSTextField",
    "NSTextFieldCell",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSRunningApplication",
    "NSWorkspace",
    # 动效曲线：NSAnimationContext.setTimingFunction 的形参是 CAMediaTimingFunction
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", features = [
    "std",
    "NSArray",
    "block2",
    "NSDate",
    "NSDateFormatter",
    "NSNotification",
    "NSFormatter",
    "NSRunLoop",
    "NSTimer",
    "NSURL",
    "NSBundle",
] }
objc2-quartz-core = "0.3"

[dev-dependencies]
test-support = { path = "../test-support" }
